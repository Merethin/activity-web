[package]
name = "activity-web"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["query"] }
axum-template = { version = "3.0.0", features = ["minijinja"] }
caramel = { path = "./caramel", features = ["akari", "ns", "log"] }
dotenv = "0.15.0"
futures = "0.3.32"
futures-util = "0.3.32"
lapin = "3.7.2"
lazy_static = "1.5.0"
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_info"] }
minijinja = "2.21.0"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tower_governor = "0.8.0"
